<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Тесты</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      a { text-decoration: none; }
      .quiz { padding: 1rem; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <h1>Тесты</h1>
    {% if quizzes %}
      {% for quiz in quizzes %}
        <div class="quiz">
          <h2><a href="{% url 'quizzes:quiz_detail' quiz.id %}">{{ quiz.title }}</a></h2>
          <p>{{ quiz.description }}</p>
        </div>
      {% endfor %}
    {% else %}
      <p>Тестов пока нет.</p>
    {% endif %}
  </body>
  </html>
