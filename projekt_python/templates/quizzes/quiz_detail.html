<style>
    .quiz-form {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        font-family: system-ui, sans-serif;
    }
    .question {
        margin-bottom: 2rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid #eee;
    }
    .question:last-child {
        border-bottom: none;
        margin-bottom: 2.5rem;
    }
    .question h4 {
        margin: 0 0 1rem;
        color: #2c3e50;
        font-size: 1.25rem;
        line-height: 1.4;
    }
    .choice-item {
        display: flex;
        align-items: flex-start;
        margin-bottom: 0.75rem;
        padding: 0.75rem;
        background: #f9fbfd;
        border-radius: 10px;
        transition: background 0.2s, transform 0.15s;
        cursor: pointer;
    }
    .choice-item:hover {
        background: #edf7ff;
    }
    .choice-item input[type="radio"] {
        margin-top: 0.35rem;
        margin-right: 0.8rem;
        transform: scale(1.2);
        cursor: pointer;
    }
    .choice-item label {
        margin: 0;
        cursor: pointer;
        flex: 1;
        font-size: 1.05rem;
        color: #34495e;
    }
    .submit-btn {
        display: block;
        width: 100%;
        padding: 1rem;
        background: #3498db;
        color: white;
        font-size: 1.1rem;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.2s;
    }
    .submit-btn:hover {
        background: #2980b9;
    }
    .submit-btn:active {
        transform: translateY(1px);
    }
</style>

<form method="post" action="{% url 'quizzes:quiz_submit' quiz.pk %}" class="quiz-form">
    {% csrf_token %}

    {% for question in quiz.questions.all %}
    <div class="question">
        <h4>{{ question.text }}</h4>
        {% for choice in question.choices.all %}
        <div class="choice-item">
            <input type="radio"
                   id="choice_{{ choice.id }}"
                   name="question_{{ question.id }}"
                   value="{{ choice.id }}"
                   required>
            <label for="choice_{{ choice.id }}">{{ choice.text }}</label>
        </div>
        {% endfor %}
    </div>
    {% endfor %}

    <button type="submit" class="submit-btn">✅ Отправить ответы</button>
</form>
