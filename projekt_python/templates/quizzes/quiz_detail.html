<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ quiz.title }}</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; }
      fieldset { border: 1px solid #ddd; border-radius: 8px; margin-bottom: 1rem; }
      legend { padding: 0 .5rem; }
      button { padding: .5rem 1rem; }
    </style>
  </head>
  <body>
    <h1>{{ quiz.title }}</h1>
    <p>{{ quiz.description }}</p>

    <form method="post" action="{% url 'quizzes:quiz_submit' quiz.id %}">
      {% csrf_token %}
      {% for question in questions %}
        <fieldset>
          <legend>Вопрос {{ forloop.counter }}</legend>
          <p>{{ question.text }}</p>
          {% for choice in question.choices.all %}
            <div>
              <label>
                <input type="radio" name="question_{{ question.id }}" value="{{ choice.id }}" />
                {{ choice.text }}
              </label>
            </div>
          {% endfor %}
        </fieldset>
      {% empty %}
        <p>Вопросов пока нет.</p>
      {% endfor %}
      <button type="submit">Отправить</button>
    </form>

    <p><a href="{% url 'quizzes:quiz_list' %}">← Назад к списку</a></p>
  </body>
  </html>
